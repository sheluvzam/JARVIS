<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JARVIS</title>
  <link rel="stylesheet" href="/mind/style.css" />
  <link rel="stylesheet" href="/chat/style.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="shell">
    <div id="app">
      <header id="header">
        <h1>JARVIS</h1>
        <div id="stats">booting…</div>
      </header>

      <aside id="legend" aria-label="Region legend"></aside>

      <aside id="inspector-panel" aria-label="Node inspector" hidden></aside>

      <canvas id="scene-canvas"></canvas>
    </div>

    <div id="chat-dock">
      <header id="chat-header">
        <div id="chat-stats">connecting…</div>
        <button id="voice-output-toggle" type="button" aria-label="Toggle voice replies">🔊</button>
      </header>

      <main id="chat-log" aria-live="polite"></main>

      <form id="composer">
        <button id="mic-button" type="button" aria-label="Speak" disabled>🎤</button>
        <input id="composer-input" type="text" placeholder="Talk to JARVIS…" autocomplete="off" disabled />
        <button id="composer-send" type="submit" disabled>Send</button>
      </form>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "/mind/vendor/three/build/three.module.js",
      "three/addons/": "/mind/vendor/three/examples-jsm/"
    }
  }
  </script>
  <!-- Both existing, unmodified script files — reused by URL, not copied. -->
  <script type="module" src="/mind/scene.js"></script>
  <script type="module" src="/chat/chat.js"></script>
</body>
</html>
